<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            }
          });
        } catch (e) {
          // Graceful fallback
        }

        window.addEventListener('error', function(event) {
          if (event && event.filename && (
            event.filename.indexOf('chrome-extension://') === 0 ||
            event.filename.indexOf('moz-extension://') === 0 ||
            event.filename.indexOf('safari-web-extension://') === 0
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
